services:
  catalogo-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${CATALOGO_DB_NAME:-catalogo_db}
      POSTGRES_USER: ${CATALOGO_DB_USER:-catalogo_app}
      POSTGRES_PASSWORD: ${CATALOGO_DB_PASSWORD:-local-dev-only}
    ports:
      - "${CATALOGO_DB_PORT:-5433}:5432"
    volumes:
      - catalogo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  turnos-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${TURNOS_DB_NAME:-turnos_db}
      POSTGRES_USER: ${TURNOS_DB_USER:-turnos_app}
      POSTGRES_PASSWORD: ${TURNOS_DB_PASSWORD:-local-dev-only}
    ports:
      - "${TURNOS_DB_PORT:-5434}:5432"
    volumes:
      - turnos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  catalogo:
    build:
      context: ../catalogo/catalogo_Programacion2
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalogo-db:5432/${CATALOGO_DB_NAME:-catalogo_db}
      SPRING_DATASOURCE_USERNAME: ${CATALOGO_DB_USER:-catalogo_app}
      SPRING_DATASOURCE_PASSWORD: ${CATALOGO_DB_PASSWORD:-local-dev-only}
    ports:
      - "${CATALOGO_API_PORT:-8081}:8081"
    depends_on:
      catalogo-db:
        condition: service_healthy

  turnos:
    build:
      context: ../turnos/turnos_Programacion2
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://turnos-db:5432/${TURNOS_DB_NAME:-turnos_db}
      SPRING_DATASOURCE_USERNAME: ${TURNOS_DB_USER:-turnos_app}
      SPRING_DATASOURCE_PASSWORD: ${TURNOS_DB_PASSWORD:-local-dev-only}
    ports:
      - "${TURNOS_API_PORT:-8082}:8082"
    depends_on:
      turnos-db:
        condition: service_healthy

volumes:
  catalogo_postgres_data:
  turnos_postgres_data:
